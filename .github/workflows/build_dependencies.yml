name: Conan Build

on:
  workflow_call:
    inputs:
      platform:
        required: false
        default: 'ubuntu-24.04'
        type: string
      branch:
        required: true
        type: string
      build-type:
        required: true
        type: string
      malloc-impl:
        required: true
        type: string
      compiler:
        required: false
        type: string
        default: 'gcc'
      conan-channel:
        required: false
        type: string
        default: 'dev'
      tooling:
        required: false
        type: string
        default: 'None'
      testing:
        required: false
        type: string
        default: 'False'
  workflow_dispatch:
    inputs:
      platform:
        required: true
        type: choice
        options:
          - ubuntu-24.04
        default: 'ubuntu-24.04'
      branch:
        required: true
        type: string
      build-type:
        required: true
        type: choice
        options:
          - Debug
          - Release
          - RelWithDebInfo
      malloc-impl:
        description: 'Allocation Library'
        required: true
        type: choice
        options:
          - libc
          - tcmalloc
          - jemalloc
      compiler:
        required: false
        type: choice
        options:
          - gcc
          - clang
        default: 'gcc'
      conan-channel:
        required: false
        type: string
        default: 'dev'
      tooling:
        required: false
        type: choice
        options:
          - 'AddressSanitize'
          - 'ThreadSanitize'
          - 'Coverage'
          - 'None'
        default: 'None'
      testing:
        description: 'Build and Run'
        required: true
        type: choice
        options:
          - 'True'
          - 'False'
        default: 'True'

jobs:
  BuildHomestoreDeps:
    runs-on: ${{ inputs.platform }}
    timeout-minutes: 1440
    steps:
    - name: Retrieve Code
      uses: actions/checkout@v4
      with:
        ref: ${{ inputs.branch }}
      if: ${{ inputs.testing == 'True' }}

    - name: Check Code Formatting
      run: |
        # GitHub PR merge commit has shallow history, so fetch the base branch
        git fetch --depth=50 origin ${{ github.base_ref }}

        echo "Comparing HEAD against origin/${{ github.base_ref }}"

        # Get C/C++ files changed in this PR
        CHANGED_FILES=$(git diff --name-only --diff-filter=d origin/${{ github.base_ref }} | grep -E '\.(c|cpp|cc|cxx|h|hpp|hxx|ipp)$' || true)

        if [[ -z "$CHANGED_FILES" ]]; then
          echo "No C/C++ files modified in this PR"
          exit 0
        fi

        echo "Checking formatting for PR-modified C/C++ files:"
        echo "$CHANGED_FILES"

        # Format only the changed files
        echo "$CHANGED_FILES" | xargs clang-format -style=file -i -fallback-style=none

        # Check if formatting changed anything
        if ! git diff --exit-code -- $CHANGED_FILES; then
          echo "::error::Code formatting check failed. PR-modified files have formatting issues."
          echo "::error::Run './apply-clang-format.sh' locally and commit the changes."
          exit 1
        fi

        echo "✓ All PR-modified files are properly formatted"
      if: ${{ github.event_name == 'pull_request' && inputs.testing == 'True' }}

    - name: Retrieve Recipe
      uses: actions/checkout@v4
      with:
        repository: eBay/Homestore
        ref: ${{ inputs.branch }}
      if: ${{ inputs.testing == 'False' }}

    - name: Setup Conan
      uses: ebay/sisl/.github/actions/setup_conan2@dev/v14.x
      with:
        platform: ${{ inputs.platform }}
        compiler: ${{ inputs.compiler }}
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Load Homestore Cache
      id: restore-cache
      uses: ebay/sisl/.github/actions/load_conan2@dev/v14.x
      with:
        testing: ${{ inputs.testing }}
        key_prefix: HomestoreDeps-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}

    - name: Load Sisl Cache
      uses: eBay/sisl/.github/actions/load_conan2@dev/v14.x
      with:
        testing: 'False'
        path: import/sisl
        key_prefix: SislDeps14-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}-${{ inputs.compiler }}
        fail_on_cache_miss: true
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Load IOMgr Cache
      uses: eBay/sisl/.github/actions/load_conan2@dev/v14.x
      with:
        testing: 'False'
        path: import/iomgr
        key_prefix: IOMgrDeps-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}
        fail_on_cache_miss: true
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Load NuraftMesg Cache
      uses: eBay/sisl/.github/actions/load_conan2@dev/v14.x
      with:
        testing: 'False'
        path: import/nuraft_mesg
        key_prefix: NuMesgDeps-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}
        fail_on_cache_miss: true
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Retrieve Dependencies
      uses: actions/checkout@v4
      with:
        repository: eBay/iomanager
        path: import/iomgr
        ref: dev/v13.x
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Retrieve Dependencies
      uses: actions/checkout@v4
      with:
        repository: eBay/nuraft_mesg
        path: import/nuraft_mesg
        ref: dev/v5.x
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Prepare Recipes
      run: |
        # make the following removed directory configurable, for example, using an environment variable.
        sudo rm -rf $ANDROID_HOME
        sudo rm -rf /usr/lib/llvm*
        sudo rm -rf /usr/lib/jvm
        sudo rm -rf /usr/lib/google-cloud-sdk
        
        pushd import/nuraft_mesg
        ./prepare_v2.sh
        conan export --user oss --channel ${{ inputs.conan-channel }}
        popd
        pushd import/iomgr
        conan export --user oss --channel ${{ inputs.conan-channel }}
        popd
      if: ${{ inputs.testing == 'True' || steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Build Cache
      run: |
        conan install \
            -o sisl/*:malloc_impl=${{ inputs.malloc-impl }} \
            -s:h build_type=${{ inputs.build-type }} \
            -c tools.build:skip_test=True \
            --format=json \
            --build missing \
            . > ~/build.json
        conan list --graph ~/build.json --graph-binaries=build,cache --format=json > ~/pkglist.json
      if: ${{ steps.restore-cache.outputs.cache-hit != 'true' }}

    - name: Save Conan Cache
      uses: eBay/sisl/.github/actions/store_conan2@dev/v14.x
      with:
        key_prefix: HomestoreDeps-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}
      if: ${{ github.event_name != 'pull_request' && steps.restore-cache.outputs.cache-hit != 'true' && inputs.tooling != 'Coverage'}}

    - name: Install gdb
      # src/tests/stack_dump_launcher.sh uses it to print the stacks of a hung test, and of a crashed one from the
      # core.<pid> file it leaves in the test directory
      run: |
        command -v gdb || (sudo apt-get update -q && sudo apt-get install -y -q gdb)
        sudo sysctl -w kernel.core_pattern=core.%p
      if: ${{ inputs.testing == 'True' }}

    - name: Create and Test Package
      run: |
        if [[ "${{ inputs.tooling }}" == "AddressSanitize" ]]; then sanitize="address"
        elif [[ "${{ inputs.tooling }}" == "ThreadSanitize" ]]; then sanitize="thread"
        else sanitize="False"; fi
        # ASan makes the templated btree tests much bigger to compile: four parallel compiles have run the runner out of
        # memory, killing the job mid-build.
        build_jobs=""
        if [[ "${sanitize}" == "address" ]]; then build_jobs="-c tools.build:jobs=2"; fi
        conan create ${build_jobs} \
            -o sisl/*:malloc_impl=${{ inputs.malloc-impl }} \
            -o homestore/*:sanitize=${sanitize} \
            -s:h build_type=${{ inputs.build-type }} \
            ${{ inputs.conan-channel != '' && format('--user oss --channel {0}', inputs.conan-channel) || '' }} \
            .
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
      if: ${{ inputs.testing == 'True' && inputs.tooling != 'Coverage' }}

    - name: Code Coverage Run
      run: |
        python -m pip install gcovr
        conan build \
            -o sisl/*:malloc_impl=${{ inputs.malloc-impl }} \
            -o homestore/*:coverage=True \
            -s:h build_type=${{ inputs.build-type }} \
            ${{ inputs.conan-channel != '' && format('--user oss --channel {0}', inputs.conan-channel) || '' }} \
            .
        gcovr --cobertura ./coverage.xml
      env:
        CTEST_OUTPUT_ON_FAILURE: 1
      if: ${{ inputs.testing == 'True' && inputs.tooling == 'Coverage' }}

    - name: Upload coverage reports to Codecov
      uses: codecov/codecov-action@v5
      with:
        files: ./coverage.xml
        disable_search: true
      if: ${{ inputs.tooling == 'Coverage' }}

    - name: Collect Test Logs
      # Also after a failed, timed out or cancelled test step: the test logs are the only record of what went wrong.
      # Pack them first: the log directories are named by time (logs/2026-10-20_19:45), and upload-artifact rejects ':'.
      run: |
        shopt -s nullglob
        dirs=(~/.conan2/p/b/homes*/b/build/*/Testing/Temporary ~/.conan2/p/b/homes*/b/build/*/src/tests/logs
              build/*/Testing/Temporary build/*/src/tests/logs)
        if (( ${#dirs[@]} )); then tar -czf test-logs.tgz --ignore-failed-read "${dirs[@]}" || true; fi
      if: ${{ always() && inputs.testing == 'True' }}

    - name: Upload Test Logs
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{ inputs.platform }}-${{ inputs.build-type }}-${{ inputs.malloc-impl }}-${{ inputs.tooling }}
        path: test-logs.tgz
        if-no-files-found: ignore
        retention-days: 7
      if: ${{ always() && inputs.testing == 'True' }}
